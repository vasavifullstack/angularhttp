<table *ngIf="EmpData">
  <tr>
    <th>emp Id</th>
    <th>Name</th>
    <th>salary</th>
  
  </tr>
   <tr *ngFor="let item of data">
    <td>{{item.id}}</td>
    <td>{{item.name}}</td>
    <td>{{item.salary}}</td>
       
    
   </tr>
</table>

<button (click)="fetchData()">fetch Data</button>

<h3>fetch the specific data by ID</h3>
<input type="text" placeholder="enter id"  #inputelement/>
<button (click)="fetchDataByID(inputelement)">fetch data by Id</button>
